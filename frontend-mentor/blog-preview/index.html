<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Mentor | Blog preview card</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="preload" href="./assets/fonts/static/Figtree-Medium.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="./assets/fonts/static/Figtree-ExtraBold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="card">
    <img class="card__image" src="./assets/images/illustration-article.svg" alt="">
    <div class="card__content">
      <span class="card__category">Learning</span>
      <span class="card__date">Published <time datetime="2023-12-21">21 Dec 2023</time></span>
      <h1 class="card__title"><a class="card__link" href="#">HTML &amp; CSS foundations</a></h1>
      <p class="card__description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
    </div>
    <div class="author">
      <img class="author__avatar" src="./assets/images/image-avatar.webp" alt="" width="64" height="65">
      <span class="author__name">Greg Hooper</span>
    </div>
  </main>
</body>
</html>
