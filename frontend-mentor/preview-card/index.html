<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frontend Mentor | Product preview card component</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <main class="card">
    <picture class="card__picture">
      <source media="(min-width: 768px)" srcset="./images/image-product-desktop.jpg" width="600" height="900" />

      <img src="./images/image-product-mobile.jpg"
        alt="A square clear glass bottle of Gabrielle Chanel perfume filled with golden liquid, lying on a light grey background."
        class="card__image" width="700" height="684" />
    </picture>
    <div class="card__content">
      <div class="card__info">
        <span class="card__subtitle">Perfume</span>
        <h1 class="card__title">Gabrielle Essence Eau De Parfum</h1>
        <p class="card__description">
          A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of
          CHANEL.
        </p>
      </div>
      <div class="card__price">
        <span class="card__price-new"><span class="visually-hidden">Current price </span>$149.99</span>
        <del class="card__price-old"><span class="visually-hidden">Original price </span>$169.99</del>
      </div>
      <button class="card__btn" type="button">
        <img src="./images/icon-cart.svg" alt="" class="card__btn-icon" />Add to Cart
      </button>
    </div>
  </main>
</body>

</html>
